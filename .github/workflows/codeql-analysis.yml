name: "CodeQL & DORA Tracking"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write            # Required so the DORA tool can output metric summaries
      security-events: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0           # Crucial: fetches full git history so DORA can calculate commit age
        
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3  
      with:
        languages: csharp
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'
        
    - name: Restore
      run: dotnet restore TodoApi/TodoApi.sln
      
    - name: Build
      run: dotnet build TodoApi/TodoApi.sln --configuration Release --no-restore
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3  

    # 👇 TRACK DEPLOYMENT FREQUENCY 
    - name: Calculate DORA Deployment Frequency
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: DeveloperMetrics/deployment-frequency@main  # 🚀 Active Marketplace Action
      with:
        workflows: 'CodeQL & DORA Tracking'             # Matches the exact name of this file
        actions-token: "${{ secrets.GITHUB_TOKEN }}"

    # 👇 TRACK LEAD TIME FOR CHANGES
    - name: Calculate DORA Lead Time for Changes
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: DeveloperMetrics/lead-time-for-changes@main  # 🚀 Active Marketplace Action
      with:
        workflows: 'CodeQL & DORA Tracking'             # Matches the exact name of this file
        actions-token: "${{ secrets.GITHUB_TOKEN }}"
