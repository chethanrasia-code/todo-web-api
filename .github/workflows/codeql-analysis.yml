name: "CodeQL & DORA Tracking"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write            # 👈 Required so the DORA tool can log metrics to your repository
      security-events: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0           # 👈 Fetches full git history so DORA can calculate time since commit
        
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3  # Updated to v3 🚀
      with:
        languages: csharp
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'
        
    - name: Restore
      run: dotnet restore TodoApi/TodoApi.sln
      
    - name: Build
      run: dotnet build TodoApi/TodoApi.sln --configuration Release --no-restore
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3  # Updated to v3 🚀

    # 👇 Triggers DORA logging only on a successful merge/push to the main branch
    - name: Log DORA Deployment & Lead Time
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: dkershner6/github-action-dora-metrics@v1
      with:
        gh-token: ${{ secrets.GITHUB_TOKEN }}
        default-branch: "main"
